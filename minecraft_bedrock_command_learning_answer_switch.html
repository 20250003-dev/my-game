<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイクラ統合版 コマンド学習アプリ</title>
<style>
:root{color-scheme:dark;--bg:#101b24;--panel:#1b2b37;--line:#3a5363;--muted:#b9c9d2;--green:#21885e;--red:#713737;--blue:#315c78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f6f8;font-family:system-ui,sans-serif}header{text-align:center;padding:25px 15px;background:#0b131a;border-bottom:1px solid var(--line)}h1{font-size:clamp(22px,4vw,32px);margin:0 0 7px}header p,.muted{color:var(--muted)}main{max-width:1050px;margin:auto;padding:18px;display:grid;gap:15px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}h2{font-size:20px;margin:0 0 14px}.row,.tabs,.actions,.categories{display:flex;flex-wrap:wrap;gap:9px;align-items:center}button{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cursor:default}.active{background:var(--green)}.categories button{flex:1 1 175px;text-align:left}.categories small{display:block;font-weight:400;color:#d5e4eb;margin-top:4px}.switch{display:flex;gap:10px;align-items:center;background:#13212b;padding:10px 12px;border-radius:10px}.switch input{width:20px;height:20px;accent-color:#32b879}.hidden{display:none!important}.code{font:15px/1.8 ui-monospace,Consolas,monospace;background:#0b141b;border:1px solid var(--line);padding:14px;border-radius:10px;overflow-wrap:anywhere}.blank{width:110px;max-width:30vw;background:#1d3b4c;border:1px solid #77bce9;border-radius:5px;color:white;font:inherit;padding:3px 6px}.choiceList{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin-top:12px}.choiceList button{text-align:left;min-height:48px;background:#28485d}.choiceList button.selected{outline:2px solid #72b7e8;background:#315c78}.choiceList button:disabled{opacity:1}.choiceList button.correct{background:#18583e}.choiceList button.wrong{background:#713737}.meaning{background:#142631;border-left:4px solid #72b7e8;border-radius:8px;padding:12px;line-height:1.7;margin-top:12px}textarea{width:100%;min-height:110px;background:#0b141b;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;font:15px ui-monospace,Consolas,monospace}.feedback{padding:13px;border-radius:10px;margin-top:12px;line-height:1.7}.ok{background:#153b2c;border:1px solid #2c8a61}.ng{background:#452626;border:1px solid #a95050}.warn{background:#40371e;border:1px solid #927936}.pill{display:inline-block;background:#304958;border-radius:30px;padding:5px 10px;font-size:12px;margin:0 5px 10px 0}.small{font-size:13px}.explain{line-height:1.7;color:#d8e4e9}footer{text-align:center;color:var(--muted);padding:5px 15px 25px;font-size:12px}
</style>
</head>
<body>
<header><h1>⛏ マイクラ統合版 コマンド学習</h1><p>統合版で使うコマンドの構文を練習しよう！</p></header>
<main>
<section class="panel">
 <div class="row" style="justify-content:space-between"><h2>学習モード</h2>
 <label class="switch"><input type="checkbox" id="executionMode"><span><b>ゲーム内実行確認を区別する</b><br><span id="modeLabel" class="small muted">OFF：構文チェックのみ</span></span></label></div>
 <p class="small muted">このアプリはMinecraft本体には接続しません。ONにしてもゲーム内の実行結果は取得できません。構文チェックとゲーム内確認を分けて表示します。</p>
 <div class="tabs"><button id="quizTab" class="active">クイズ</button><button id="freeTab">フリー</button></div>
</section>
<section class="panel" id="quizSection">
 <h2>クイズ：構文の種類を選択</h2>
 <label class="switch" style="margin-bottom:12px;width:max-content;max-width:100%">
  <input type="checkbox" id="answerMode">
  <span><b>回答方法</b><br><span id="answerModeLabel" class="small muted">OFF：記述式 ／ ON：3択式</span></span>
 </label>
 <div id="categories" class="categories"></div>
 <div id="quizArea" class="hidden">
  <div><span id="qCategory" class="pill"></span><span id="qCount" class="pill"></span><span class="pill">ランダム出題</span></div>
  <p id="qPrompt" class="explain">空欄に入る文字を入力してください。</p>
  <div id="qCommand" class="code"></div>
  <div id="answerChoices" class="choiceList hidden"></div>
  <div class="meaning"><b>コマンドの意味</b><div id="qMeaning"></div></div>
  <div class="actions" style="margin-top:14px"><button id="checkAnswer">答え合わせ</button><button id="nextQuestion">次の問題</button></div>
  <div id="quizFeedback" aria-live="polite"></div>
 </div>
</section>
<section class="panel hidden" id="freeSection">
 <h2>フリー：自由にコマンドを入力</h2>
 <p class="small muted">例：/give @p diamond 1</p>
 <textarea id="freeCommand" spellcheck="false" placeholder="ここに統合版のコマンドを入力"></textarea>
 <div class="actions" style="margin-top:12px"><button id="analyzeCommand">構文を確認</button><button id="clearCommand">クリア</button></div>
 <div id="freeResult" aria-live="polite"></div>
</section>
</main><footer>統合版向けの学習用簡易チェックです。Minecraftのバージョンや設定によって使える構文は異なる場合があります。</footer>
<script>
const groups=[
{cat:"say",desc:"メッセージを表示",items:[
["/say こんにちは","こんにちは","ワールド内にメッセージを表示します。","表示したいメッセージです。"]]},
{cat:"time",desc:"時刻を変更・確認",items:[
["/time set day","day","ワールドの時刻を昼にします。","昼を表す指定です。"]]},
{cat:"weather",desc:"天気を変更",items:[
["/weather clear","clear","天気を晴れにします。","晴れを表す指定です。"]]},
{cat:"difficulty",desc:"難易度を変更",items:[
["/difficulty normal","normal","難易度をノーマルに変更します。","難易度の指定です。"]]},
{cat:"tp",desc:"テレポート",items:[
["/tp @p 0 64 0","@p","最も近いプレイヤーを指定座標へ移動させます。","対象を指定するセレクターです。"]]},
{cat:"ゲームモード",desc:"gamemode",items:[
["/gamemode survival @s","survival","コマンド実行者をサバイバルモードにします。","サバイバルモードの指定です。"]]},
{cat:"spawnpoint",desc:"プレイヤーのリスポーン地点",items:[
["/spawnpoint @p 0 64 0","@p","最も近いプレイヤーのリスポーン地点を設定します。","対象を指定するセレクターです。"]]},
{cat:"setworldspawn",desc:"ワールドの初期スポーン地点",items:[
["/setworldspawn 0 64 0","0","ワールドの初期スポーン地点を指定します。","X座標です。"]]},
{cat:"give",desc:"アイテムを与える",items:[
["/give @p diamond 1","diamond","最も近いプレイヤーにダイヤモンドを1個与えます。","アイテムIDです。"]]},
{cat:"clear",desc:"アイテムを削除",items:[
["/clear @s","@s","コマンド実行者のインベントリからアイテムを削除します。","コマンドを実行した本人を表します。"]]},
{cat:"effect",desc:"ステータス効果",items:[
["/effect @p speed 30 1","speed","最も近いプレイヤーに移動速度上昇を30秒間付与します。","効果のIDです。"]]},
{cat:"summon",desc:"エンティティを召喚",items:[
["/summon zombie ~ ~1 ~","zombie","実行位置の1ブロック上にゾンビを召喚します。","召喚するエンティティのIDです。"]]},
{cat:"kill",desc:"対象を倒す",items:[
["/kill @e[type=zombie]","@e[type=zombie]","ゾンビをすべて倒します。","対象を指定するセレクターです。"]]},
{cat:"setblock",desc:"ブロックを設置",items:[
["/setblock 0 64 0 stone","stone","指定座標に石を設置します。","ブロックIDです。"]]},
{cat:"fill",desc:"範囲をブロックで埋める",items:[
["/fill 0 60 0 5 65 5 glass","glass","指定した範囲をガラスで埋めます。","ブロックIDです。"]]},
{cat:"tag",desc:"タグを追加・削除・確認",items:[
["/tag @p add red","add","最も近いプレイヤーに red タグを追加します。","タグを追加するときの操作です。"],
["/tag @a remove red","remove","全プレイヤーから red タグを削除します。","タグを取り除く操作です。"]]},
{cat:"セレクター",desc:"@a・@p・@r・@e・@s",items:[
["/tp @a 0 64 0","@a","全プレイヤーを指定座標へ移動させます。","全プレイヤーを表すセレクターです。"],
["/tp @p 0 64 0","@p","最も近いプレイヤーを指定座標へ移動させます。","最も近いプレイヤーを表すセレクターです。"],
["/tp @r 0 64 0","@r","ランダムなプレイヤーを指定座標へ移動させます。","ランダムなプレイヤーを表すセレクターです。"],
["/tp @s 0 64 0","@s","コマンド実行者を指定座標へ移動させます。","コマンド実行者を表すセレクターです。"]]},
{cat:"hasitem",desc:"持っているアイテムで対象を絞る",items:[
["/tp @a[hasitem={item=diamond}] 0 64 0","hasitem","ダイヤモンドを持っているプレイヤーをテレポートさせます。","所持アイテムの条件を指定する部分です。"],
["/tag @a[hasitem={item=apple,quantity=1..}] add apple_user","quantity=1..","リンゴを1個以上持つプレイヤーにタグを追加します。","所持数を1個以上に指定します。"]]},
{cat:"ゲームルール",desc:"gamerule",items:[
["/gamerule keepinventory true","keepinventory","死亡時にインベントリを保持する設定を有効にします。","インベントリ保持のゲームルール名です。"],
["/gamerule mobgriefing false","false","モブによるブロック破壊などを無効にします。","設定を無効にする値です。"]]},
{cat:"スコアボード",desc:"目標やスコアを管理",items:[
["/scoreboard objectives add point dummy","dummy","point というダミー形式の目標を作成します。","手動で値を管理する目標の種類です。"],
["/scoreboard players add @p point 1","add","最も近いプレイヤーの point を1増やします。","値を加算する操作です。"]]},
{cat:"execute",desc:"条件や実行位置を指定",items:[
["/execute as @a at @s run say こんにちは","run","全プレイヤーそれぞれを実行者・実行位置としてメッセージを表示します。","後ろに続くコマンドを実行する語です。"],
["/execute if entity @e[type=zombie] run say ゾンビがいます","if","ゾンビがいる場合にメッセージを表示します。","条件が成立した場合に実行する語です。"]]},
{cat:"title",desc:"タイトルや字幕を表示",items:[
["/title @a title ゲーム開始","title","全プレイヤーの画面中央にタイトルを表示します。","大きなタイトルを表示する形式です。"],
["/title @p actionbar 準備して","actionbar","最も近いプレイヤーの画面下部に表示します。","画面下部に表示する形式です。"]]}
];
const $=id=>document.getElementById(id);let pool=[],index=0,current=null,score=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function startQuiz(cat){let all=[];groups.forEach(g=>g.items.forEach(q=>all.push({category:g.cat,cmd:q[0],answer:q[1],meaning:q[2],hint:q[3]})));if(cat!==-1)all=all.filter(q=>q.category===groups[cat].cat);pool=shuffle(all);index=0;score=0;$("quizArea").classList.remove("hidden");showQuestion()}
let selectedChoice=null;
function renderAnswer(){
 if(!current)return;
 const tokens=current.cmd.split(" "),doneIndex=tokens.indexOf(current.answer);
 let mode=$("answerMode").checked;
 $("qCommand").innerHTML=tokens.map((t,i)=>i===doneIndex?'<span id="answerSlot" class="blank" style="display:inline-block;min-width:100px;text-align:center">'+(mode?(selectedChoice===null?"選択してください":esc(selectedChoice)):'記述')+'</span>':esc(t)).join(" ");
 if(mode){
  let allAnswers=[...new Set(groups.flatMap(g=>g.items.map(q=>q[1])))].filter(a=>a!==current.answer);
  let options=shuffle([current.answer,...shuffle(allAnswers).slice(0,2)]);
  $("answerChoices").innerHTML=options.map(opt=>'<button type="button" data-answer="'+esc(opt)+'" class="'+(selectedChoice===opt?'selected':'')+'">'+esc(opt)+'</button>').join("");
  $("answerChoices").classList.remove("hidden");
  $("answerChoices").querySelectorAll("button").forEach(b=>b.onclick=()=>{
   if($("checkAnswer").disabled)return;
   selectedChoice=b.dataset.answer;
   $("answerSlot").textContent=selectedChoice;
   $("answerChoices").querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x.dataset.answer===selectedChoice));
  });
 }else{
  $("answerChoices").innerHTML="";
  $("answerChoices").classList.add("hidden");
  $("qCommand").innerHTML=tokens.map((t,i)=>i===doneIndex?'<input id="answerInput" class="blank" type="text" autocomplete="off" aria-label="空欄">':esc(t)).join(" ");
 }
}
function showQuestion(){
 if(index>=pool.length){
  $("qCategory").textContent="結果";$("qCount").textContent="終了";$("qPrompt").textContent=`全問終了！ ${score} / ${pool.length} 問正解`;
  $("qCommand").textContent="おつかれさまでした！";$("qMeaning").textContent="別の種類を選ぶと、新しい順番で挑戦できます。";
  $("quizFeedback").innerHTML="";$("answerChoices").innerHTML="";$("answerChoices").classList.add("hidden");$("checkAnswer").disabled=true;return
 }
 current=pool[index];selectedChoice=null;
 $("qCategory").textContent=current.category;$("qCount").textContent=(index+1)+" / "+pool.length+" 問";
 $("qPrompt").textContent="空欄に入る文字を答えてください。";
 $("qMeaning").textContent=current.meaning;$("quizFeedback").innerHTML="";$("checkAnswer").disabled=false;
 renderAnswer();
 $("nextQuestion").textContent=index===pool.length-1?"結果を見る":"次の問題";
}
groups.forEach((g,i)=>{let b=document.createElement("button");b.innerHTML=esc(g.cat)+"<small>"+esc(g.desc)+"</small>";b.onclick=()=>startQuiz(i);$("categories").appendChild(b)});
let mix=document.createElement("button");mix.className="active";mix.innerHTML='ミックス<small>すべての種類からランダム出題</small>';mix.onclick=()=>startQuiz(-1);$("categories").appendChild(mix);
$("checkAnswer").onclick=()=>{
 if(!current)return;
 let v=$("answerMode").checked?selectedChoice:$("answerInput")?.value.trim();
 if(v===undefined||v===null||v===""){ $("quizFeedback").innerHTML='<div class="feedback warn">回答を入力または選択してください。</div>';return }
 let ok=v.toLowerCase()===current.answer.toLowerCase();
 if(ok){score++;$("quizFeedback").innerHTML='<div class="feedback ok">正解！ '+esc(current.answer)+'<br>'+esc(current.hint)+'</div>'}
 else{$("quizFeedback").innerHTML='<div class="feedback ng">不正解。正解は <b>'+esc(current.answer)+'</b> です。<br>'+esc(current.hint)+'</div>'}
 $("checkAnswer").disabled=true;
 $("answerChoices").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.dataset.answer===current.answer)b.classList.add("correct");else if(b.dataset.answer===v)b.classList.add("wrong")});
};
$("nextQuestion").onclick=()=>{if(index<pool.length){index++;showQuestion()}};
$("answerMode").onchange=()=>{
 $("answerModeLabel").textContent=$("answerMode").checked?"ON：3択式":"OFF：記述式";
 if(current&&index<pool.length){selectedChoice=null;$("quizFeedback").innerHTML="";$("checkAnswer").disabled=false;renderAnswer()}
};
$("quizTab").onclick=()=>{$("quizSection").classList.remove("hidden");$("freeSection").classList.add("hidden");$("quizTab").classList.add("active");$("freeTab").classList.remove("active")};
$("freeTab").onclick=()=>{$("freeSection").classList.remove("hidden");$("quizSection").classList.add("hidden");$("freeTab").classList.add("active");$("quizTab").classList.remove("active")};
$("executionMode").onchange=e=>$("modeLabel").textContent=e.target.checked?"ON：構文チェックとゲーム内確認を分けて表示":"OFF：構文チェックのみ";
$("clearCommand").onclick=()=>{$("freeCommand").value="";$("freeResult").innerHTML=""};

const defs={
say:["/say <メッセージ>","メッセージをワールド内に表示します。",2],
me:["/me <アクション>","実行者の動作メッセージを表示します。",2],
give:["/give <対象> <アイテム> [個数]","対象にアイテムを与えます。",3],
clear:["/clear <対象> [アイテム] [最大個数]","対象のインベントリからアイテムを削除します。",2],
tp:["/tp <対象> <x> <y> <z>","対象を指定座標へテレポートさせます。",3],
teleport:["/teleport <対象> <x> <y> <z>","対象を指定座標へテレポートさせます。",3],
gamemode:["/gamemode <survival|creative|adventure|spectator> [対象]","対象のゲームモードを変更します。",2],
effect:["/effect <対象> <効果> [秒数] [増幅値]","対象にステータス効果を付与・解除します。",3],
summon:["/summon <エンティティ> [位置]","指定したエンティティを召喚します。",2],
kill:["/kill [対象]","指定した対象を倒します。",1],
tag:["/tag <対象> <add|remove|list> [タグ名]","対象のタグを追加・削除・一覧表示します。",3],
title:["/title <対象> <title|subtitle|actionbar|clear|reset> [文字]","対象の画面にタイトルなどを表示します。",3],
time:["/time <set|add|query> <値>","ワールドの時刻を変更・確認します。",3],
weather:["/weather <clear|rain|thunder> [時間]","ワールドの天気を変更します。",2],
setblock:["/setblock <x> <y> <z> <ブロック>","指定座標にブロックを設置します。",5],
fill:["/fill <始点x y z> <終点x y z> <ブロック>","指定範囲をブロックで埋めます。",8],
scoreboard:["/scoreboard objectives|players ...","スコアボードの目標やスコアを管理します。",3],
execute:["/execute <as|at|positioned|if|unless|run> ...","実行者・位置・条件を指定して別のコマンドを実行します。",3],
gamerule:["/gamerule <ルール名> [値]","ワールドのゲームルールを変更・確認します。",2],
difficulty:["/difficulty <peaceful|easy|normal|hard>","ワールドの難易度を変更します。",2],
spawnpoint:["/spawnpoint <対象> [x y z]","対象のリスポーン地点を設定します。",2],
setworldspawn:["/setworldspawn [x y z]","ワールドの初期スポーン地点を設定します。",1],
playsound:["/playsound <音> [対象] [位置]","指定した音を再生します。",2],
stopsound:["/stopsound <対象> [音]","対象の音の再生を停止します。",2],
particle:["/particle <パーティクル> [位置]","指定位置にパーティクルを表示します。",2]
};
function selector(s){return /^@(?:a|p|r|e|s)(?:\[[^\]]*\])?$/.test(s)}
function coord(s){return /^(?:~-?(?:\d+(?:\.\d*)?|\.\d+)?|\^-?(?:\d+(?:\.\d*)?|\.\d+)?|-?(?:\d+(?:\.\d*)?|\.\d+))$/.test(s)}
function check(cmd){
 let t=cmd.trim().replace(/^\/+/,"").split(/\s+/),root=t[0];if(!root)return {ok:false,msg:"コマンドを入力してください。",meaning:""};
 if(!defs[root])return {ok:null,msg:"この簡易チェッカーでは「"+esc(root)+"」の詳しい構文を判定できません。統合版のコマンド一覧と照らし合わせてください。",meaning:"意味を確実に判定できません。"};
 let d=defs[root],errors=[];
 if(t.length<d[2])errors.push("引数が足りない可能性があります。基本形："+esc(d[0]));
 if(["give","clear","tp","teleport","gamemode","effect","kill","tag","title","spawnpoint"].includes(root)&&t[1]?.startsWith("@")&&!selector(t[1]))errors.push("対象の指定「"+esc(t[1])+"」を確認してください。@a / @p / @r / @e / @s などの形式が必要です。");
 if(root==="gamemode"&&!["survival","creative","adventure","spectator","s","c","a"].includes(t[1]))errors.push("ゲームモードは survival / creative / adventure / spectator などを指定します。");
 if(root==="weather"&&!["clear","rain","thunder"].includes(t[1]))errors.push("weather の指定は clear / rain / thunder です。");
 if(root==="time"&&!["set","add","query"].includes(t[1]))errors.push("time の次は set / add / query です。");
 if(root==="tag"&&!["add","remove","list"].includes(t[2]))errors.push("tag の操作は add / remove / list です。");
 if(root==="execute"&&!["as","at","positioned","if","unless","align","anchored","facing","rotated","in","run"].includes(t[1]))errors.push("execute の次の構文を確認してください。");
 if(root==="setblock"&&t.slice(1,4).some(x=>!coord(x)))errors.push("setblock の座標は数値、~、^ などで指定します。");
 if(root==="fill"&&t.slice(1,7).some(x=>!coord(x)))errors.push("fill の最初の6つは2点分の座標です。");
 if(root==="scoreboard"&&!["objectives","players"].includes(t[1]))errors.push("scoreboard の次は objectives または players です。");
 if(root==="scoreboard"&&t[1]==="objectives"&&!["list","add","remove","setdisplay"].includes(t[2]))errors.push("objectives の操作は list / add / remove / setdisplay です。");
 if(root==="scoreboard"&&t[1]==="players"&&!["list","set","add","remove","reset","operation"].includes(t[2]))errors.push("players の操作を確認してください。");
